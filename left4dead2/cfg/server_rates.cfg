// 100 Tickrate Network Settings
// Estos comandos aseguran que los clientes y el servidor se sincronicen 100 veces por segundo
sv_minrate 100000
sv_maxrate 0
sv_minupdaterate 60
sv_maxupdaterate 60
sv_mincmdrate 60
sv_maxcmdrate 60
fps_max 0

// Interpolation (para reducir lag visual de infectados)
sv_client_min_interp_ratio 0
sv_client_max_interp_ratio 1
